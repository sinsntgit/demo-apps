services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      T2S_DATABASE_URL: postgresql+psycopg2://t2s:${T2S_DB_PASSWORD:-t2s-local}@db:5432/t2s
    volumes: ["t2s-data:/data"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: t2s
      POSTGRES_PASSWORD: ${T2S_DB_PASSWORD:-t2s-local}
      POSTGRES_DB: t2s
    volumes: ["t2s-meta:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U t2s"], interval: 5s, retries: 10 }
    restart: unless-stopped
volumes:
  t2s-data:
  t2s-meta:
